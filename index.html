<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Code ベストプラクティス 理解度クイズ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #21262d;
            --border: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-purple: #a371f7;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-orange: #d29922;
            --gradient-start: #58a6ff;
            --gradient-end: #a371f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(88, 166, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(88, 166, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 20px;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 4px;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .stat-value.score { color: var(--accent-green); }
        .stat-value.question { color: var(--accent-blue); }
        .stat-value.accuracy { color: var(--accent-purple); }

        .progress-bar {
            height: 4px;
            background: var(--bg-card);
            border-radius: 2px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
            border-radius: 2px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .quiz-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .question-badge {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .category-tag {
            background: var(--bg-card);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
        }

        .card-body {
            padding: 24px;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 24px;
            line-height: 1.7;
        }

        .code-snippet {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            overflow-x: auto;
            color: var(--accent-blue);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .option:hover:not(.disabled) {
            border-color: var(--accent-blue);
            background: rgba(88, 166, 255, 0.05);
        }

        .option.selected {
            border-color: var(--accent-purple);
            background: rgba(163, 113, 247, 0.1);
        }

        .option.correct {
            border-color: var(--accent-green);
            background: rgba(63, 185, 80, 0.1);
        }

        .option.wrong {
            border-color: var(--accent-red);
            background: rgba(248, 81, 73, 0.1);
        }

        .option.disabled {
            cursor: default;
        }

        .option-marker {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .option.correct .option-marker {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: white;
        }

        .option.wrong .option-marker {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: white;
        }

        .option-text {
            flex: 1;
            padding-top: 4px;
        }

        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .feedback.show { display: block; }

        .feedback.correct {
            background: rgba(63, 185, 80, 0.1);
            border: 1px solid var(--accent-green);
        }

        .feedback.wrong {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid var(--accent-red);
        }

        .feedback-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .feedback.correct .feedback-header { color: var(--accent-green); }
        .feedback.wrong .feedback-header { color: var(--accent-red); }

        .feedback-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .feedback-text code {
            background: var(--bg-primary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent-blue);
        }

        .card-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: none;
        }

        .next-btn.show { display: block; }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(88, 166, 255, 0.3);
        }

        /* Results */
        .results {
            display: none;
            text-align: center;
        }

        .results.show { display: block; }

        .results-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
        }

        .results-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .results-score {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .results-label {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .results-grade {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .results-grade.excellent { background: rgba(63, 185, 80, 0.2); color: var(--accent-green); }
        .results-grade.good { background: rgba(88, 166, 255, 0.2); color: var(--accent-blue); }
        .results-grade.fair { background: rgba(210, 153, 34, 0.2); color: var(--accent-orange); }
        .results-grade.needs-work { background: rgba(248, 81, 73, 0.2); color: var(--accent-red); }

        .results-message {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 10px;
        }

        .results-tips {
            text-align: left;
            background: var(--bg-card);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .results-tips h3 {
            color: var(--accent-blue);
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .results-tips ul {
            color: var(--text-secondary);
            padding-left: 20px;
        }

        .results-tips li {
            margin-bottom: 8px;
        }

        .restart-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 32px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .restart-btn:hover {
            border-color: var(--accent-blue);
            background: rgba(88, 166, 255, 0.1);
        }

        @media (max-width: 600px) {
            .stats-bar { gap: 15px; flex-wrap: wrap; }
            .card-body { padding: 20px; }
            .question-text { font-size: 1.05rem; }
            .option { padding: 14px 16px; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">&gt;_</div>
            </div>
            <h1>Claude Code ベストプラクティス</h1>
            <p class="subtitle">チーム向け理解度チェッククイズ（10問）</p>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-label">正解数</div>
                <div class="stat-value score" id="correctCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">進捗</div>
                <div class="stat-value question"><span id="currentQ">1</span>/10</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">正解率</div>
                <div class="stat-value accuracy" id="accuracy">--%</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="quiz-card" id="quizCard">
            <div class="card-header">
                <span class="question-badge" id="questionBadge">Q1</span>
                <span class="category-tag" id="categoryTag">カテゴリ</span>
            </div>
            <div class="card-body">
                <p class="question-text" id="questionText"></p>
                <div id="codeSnippet"></div>
                <div class="options" id="options"></div>
                <div class="feedback" id="feedback">
                    <div class="feedback-header" id="feedbackHeader"></div>
                    <p class="feedback-text" id="feedbackText"></p>
                </div>
            </div>
            <div class="card-footer">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次の問題へ →</button>
            </div>
        </div>

        <div class="results" id="results">
            <div class="results-card">
                <div class="results-icon" id="resultsIcon">🏆</div>
                <div class="results-score" id="finalScore">0/10</div>
                <p class="results-label">正解数</p>
                <div class="results-grade" id="resultsGrade">評価</div>
                <div class="results-message" id="resultsMessage"></div>
                <div class="results-tips" id="resultsTips">
                    <h3>💡 学習のポイント</h3>
                    <ul id="tipsList"></ul>
                </div>
                <button class="restart-btn" onclick="restartQuiz()">もう一度挑戦する</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                category: "CLAUDE.md",
                question: "CLAUDE.mdファイルの主な目的として正しいものはどれですか？",
                options: [
                    "プロジェクトの依存関係を管理する",
                    "Claudeが自動的に読み込むコンテキスト情報を提供する",
                    "コードのバージョン管理を行う",
                    "ビルド設定を定義する"
                ],
                correct: 1,
                explanation: "<code>CLAUDE.md</code>はClaudeが会話開始時に自動的に読み込む特別なファイルです。bashコマンド、コードスタイル、テスト手順、リポジトリのルールなど、プロジェクト固有のコンテキストを記述します。チームで共有することで、全員が一貫したClaude体験を得られます。"
            },
            {
                category: "ワークフロー",
                question: "Anthropicが推奨する「Explore, Plan, Code, Commit」ワークフローで、コードを書く前に行うべきステップはどれですか？",
                options: [
                    "すぐにコードを書き始め、後から計画を立てる",
                    "ファイルを読み込み、計画を立ててからコードを書く",
                    "テストを先に書いてからコードを書く",
                    "PRを作成してからコードを書く"
                ],
                correct: 1,
                explanation: "推奨ワークフローは、(1)関連ファイルを読む→(2)計画を立てる→(3)コードを実装→(4)コミット・PR作成の順です。計画なしにすぐコードを書くと、Claudeは最適でない解決策に飛びつく傾向があります。「think」や「think hard」で拡張思考モードを使うと、より深い計画が立てられます。"
            },
            {
                category: "Extended Thinking",
                question: "Claude Codeで拡張思考（Extended Thinking）を最大レベルで発動させるキーワードはどれですか？",
                options: [
                    "think deeply",
                    "analyze carefully",
                    "ultrathink",
                    "consider thoroughly"
                ],
                correct: 2,
                explanation: "拡張思考には段階があります：<code>think</code> < <code>think hard</code> < <code>think harder</code> < <code>ultrathink</code>。ultrathinkは最大の思考バジェットを割り当て、複雑な問題の分析やアーキテクチャ決定に最適です。"
            },
            {
                category: "メモリ管理",
                question: "CLAUDE.mdファイルの配置場所として正しくないものはどれですか？",
                options: [
                    "プロジェクトのルートディレクトリ",
                    "~/.claude/CLAUDE.md（ホームディレクトリ）",
                    "node_modulesフォルダ内",
                    "サブディレクトリ内（オンデマンドで読み込まれる）"
                ],
                correct: 2,
                explanation: "CLAUDE.mdは、プロジェクトルート、親ディレクトリ（モノレポ用）、子ディレクトリ（オンデマンド読み込み）、ホームフォルダ（<code>~/.claude/CLAUDE.md</code>、全セッション適用）に配置できます。node_modules内は適切な場所ではありません。"
            },
            {
                category: "パーミッション",
                question: "Claude Codeで特定のbashコマンドを常に許可する設定として正しいものはどれですか？",
                options: [
                    "Bash(*)",
                    "Bash(git commit:*)",
                    "AllowBash(git)",
                    "permit bash git"
                ],
                correct: 1,
                explanation: "<code>Bash(git commit:*)</code>のように、コマンドとワイルドカードを組み合わせてパーミッションを設定します。<code>/permissions</code>コマンドで管理でき、<code>.claude/settings.json</code>に保存されます。チームで共有することで、一貫したパーミッション設定が可能です。"
            },
            {
                category: "MCP",
                question: "MCP（Model Context Protocol）サーバーの主な役割として正しいものはどれですか？",
                options: [
                    "Claudeの応答速度を向上させる",
                    "外部ツールやサービスへのアクセスを提供する",
                    "コードの自動フォーマットを行う",
                    "セキュリティスキャンを実行する"
                ],
                correct: 1,
                explanation: "MCPはClaudeを外部ツール（GitHub、データベース、Puppeteerなど）に接続するプロトコルです。<code>.mcp.json</code>ファイルで設定を共有でき、チーム全員が同じツールにアクセスできます。<code>--mcp-debug</code>フラグで設定問題をデバッグできます。"
            },
            {
                category: "Subagent",
                question: "Subagent（サブエージェント）の特徴として正しいものはどれですか？",
                options: [
                    "メインの会話と同じコンテキストを常に共有する",
                    "独立したコンテキストで並行作業が可能",
                    "ファイルの読み取りのみ可能で編集はできない",
                    "インターネット接続が必須"
                ],
                correct: 1,
                explanation: "Subagentはメインの会話とは別のコンテキストで動作し、並行作業が可能です。<code>.claude/agents/</code>にMarkdownファイルで定義し、ツールアクセスやパーミッションを個別に制御できます。コードレビュー専用、リサーチ専用など、特化した役割を持たせることができます。"
            },
            {
                category: "Git Worktrees",
                question: "Git worktreesを使った並行開発のメリットとして正しいものはどれですか？",
                options: [
                    "コミット履歴が自動的にマージされる",
                    "複数のブランチを別ディレクトリで同時に作業できる",
                    "コンフリクトが絶対に発生しない",
                    "リモートリポジトリが不要になる"
                ],
                correct: 1,
                explanation: "Git worktreesは同じリポジトリから複数のブランチを別ディレクトリにチェックアウトし、各worktreeでClaude Codeを独立して実行できます。<code>git worktree add ../project-feature-a feature-a</code>で作成し、複数の独立タスクを並行処理できます。"
            },
            {
                category: "スラッシュコマンド",
                question: "カスタムスラッシュコマンドを保存する正しいディレクトリはどれですか？",
                options: [
                    ".vscode/commands/",
                    ".claude/commands/",
                    ".github/commands/",
                    "scripts/claude/"
                ],
                correct: 1,
                explanation: "<code>.claude/commands/</code>フォルダにMarkdownファイルを保存すると、<code>/</code>メニューからアクセスできます。<code>$ARGUMENTS</code>キーワードでパラメータを渡せます。例：<code>.claude/commands/fix-issue.md</code>を作成し、<code>/project:fix-issue 1234</code>で使用。"
            },
            {
                category: "ベストプラクティス",
                question: "Claude Codeのコンテキストウィンドウ管理として推奨される方法はどれですか？",
                options: [
                    "常に全ての会話履歴を保持する",
                    "タスク間で/clearコマンドを使用してコンテキストをリセットする",
                    "/compactコマンドを頻繁に使用する",
                    "コンテキスト管理は不要"
                ],
                correct: 1,
                explanation: "長いセッションではコンテキストウィンドウが無関係な情報で埋まり、パフォーマンスが低下します。タスク間で<code>/clear</code>を使用してリセットしましょう。<code>/compact</code>は要約に時間がかかるため、必要な場合のみ使用します。<code>/memory</code>でロードされているメモリファイルを確認できます。"
            }
        ];

        let currentQuestion = 0;
        let correctAnswers = 0;
        let answered = false;

        function loadQuestion() {
            const q = quizData[currentQuestion];
            document.getElementById('questionBadge').textContent = `Q${currentQuestion + 1}`;
            document.getElementById('categoryTag').textContent = q.category;
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('currentQ').textContent = currentQuestion + 1;
            
            const codeSnippetEl = document.getElementById('codeSnippet');
            if (q.codeSnippet) {
                codeSnippetEl.innerHTML = `<div class="code-snippet">${q.codeSnippet}</div>`;
            } else {
                codeSnippetEl.innerHTML = '';
            }
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            const markers = ['A', 'B', 'C', 'D'];
            q.options.forEach((option, index) => {
                const optionEl = document.createElement('div');
                optionEl.className = 'option';
                optionEl.innerHTML = `
                    <span class="option-marker">${markers[index]}</span>
                    <span class="option-text">${option}</span>
                `;
                optionEl.onclick = () => selectOption(index);
                optionsContainer.appendChild(optionEl);
            });
            
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('nextBtn').className = 'next-btn';
            answered = false;
            
            const progress = (currentQuestion / quizData.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function selectOption(index) {
            if (answered) return;
            answered = true;
            
            const q = quizData[currentQuestion];
            const options = document.querySelectorAll('.option');
            
            options.forEach((opt, i) => {
                opt.classList.add('disabled');
                if (i === q.correct) {
                    opt.classList.add('correct');
                } else if (i === index && index !== q.correct) {
                    opt.classList.add('wrong');
                }
            });
            
            const feedback = document.getElementById('feedback');
            const feedbackHeader = document.getElementById('feedbackHeader');
            const feedbackText = document.getElementById('feedbackText');
            
            if (index === q.correct) {
                correctAnswers++;
                document.getElementById('correctCount').textContent = correctAnswers;
                feedback.className = 'feedback correct show';
                feedbackHeader.innerHTML = '✓ 正解！';
            } else {
                feedback.className = 'feedback wrong show';
                feedbackHeader.innerHTML = '✗ 不正解';
            }
            feedbackText.innerHTML = q.explanation;
            
            // Update accuracy
            const accuracy = Math.round((correctAnswers / (currentQuestion + 1)) * 100);
            document.getElementById('accuracy').textContent = accuracy + '%';
            
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.className = 'next-btn show';
            nextBtn.textContent = currentQuestion === quizData.length - 1 ? '結果を見る →' : '次の問題へ →';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= quizData.length) {
                showResults();
            } else {
                document.getElementById('quizCard').style.animation = 'none';
                setTimeout(() => {
                    document.getElementById('quizCard').style.animation = 'fadeIn 0.4s ease';
                    loadQuestion();
                }, 10);
            }
        }

        function showResults() {
            document.getElementById('quizCard').style.display = 'none';
            document.getElementById('results').className = 'results show';
            document.getElementById('finalScore').textContent = `${correctAnswers}/10`;
            document.getElementById('progressFill').style.width = '100%';
            
            const percentage = (correctAnswers / 10) * 100;
            const gradeEl = document.getElementById('resultsGrade');
            const iconEl = document.getElementById('resultsIcon');
            const messageEl = document.getElementById('resultsMessage');
            const tipsEl = document.getElementById('tipsList');
            
            let grade, gradeClass, icon, message, tips;
            
            if (percentage >= 90) {
                grade = 'エキスパート';
                gradeClass = 'excellent';
                icon = '🎯';
                message = '素晴らしい！Claude Codeのベストプラクティスを完全に理解しています。チームのリーダーとして他のメンバーへの指導も期待できます。';
                tips = [
                    'Subagentを活用した高度な並行処理を試してみましょう',
                    'カスタムMCPサーバーの構築にチャレンジしてください',
                    'チームのCLAUDE.mdテンプレートを作成・共有しましょう'
                ];
            } else if (percentage >= 70) {
                grade = '上級者';
                gradeClass = 'good';
                icon = '👏';
                message = '良い結果です！基本的なベストプラクティスは理解できています。いくつかの応用機能をさらに学ぶと、より効果的にClaude Codeを活用できます。';
                tips = [
                    'Extended Thinkingの各レベル（think, think hard, ultrathink）を実際に試してみましょう',
                    'Git worktreesを使った並行開発を練習しましょう',
                    'カスタムスラッシュコマンドを作成してワークフローを効率化しましょう'
                ];
            } else if (percentage >= 50) {
                grade = '中級者';
                gradeClass = 'fair';
                icon = '📚';
                message = '基礎は理解できていますが、まだ改善の余地があります。公式ドキュメントを参照しながら、実際に手を動かして学んでいきましょう。';
                tips = [
                    'CLAUDE.mdファイルの作成から始めましょう（/initコマンドで自動生成可能）',
                    '/permissionsコマンドでパーミッション管理を学びましょう',
                    '「Explore, Plan, Code, Commit」ワークフローを意識的に実践しましょう'
                ];
            } else {
                grade = '要学習';
                gradeClass = 'needs-work';
                icon = '💪';
                message = 'Claude Codeの基本機能についてもう少し学習が必要です。公式ドキュメントを読み、実際にツールを使いながら理解を深めていきましょう。';
                tips = [
                    'まずは公式ドキュメント（docs.anthropic.com）を読みましょう',
                    'シンプルなプロジェクトでCLAUDE.mdを作成する練習をしましょう',
                    '/helpコマンドで利用可能な機能を確認しましょう',
                    'このクイズの解説を復習し、再度チャレンジしてください'
                ];
            }
            
            gradeEl.textContent = grade;
            gradeEl.className = `results-grade ${gradeClass}`;
            iconEl.textContent = icon;
            messageEl.textContent = message;
            tipsEl.innerHTML = tips.map(tip => `<li>${tip}</li>`).join('');
        }

        function restartQuiz() {
            currentQuestion = 0;
            correctAnswers = 0;
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('accuracy').textContent = '--%';
            document.getElementById('results').className = 'results';
            document.getElementById('quizCard').style.display = 'block';
            document.getElementById('quizCard').style.animation = 'fadeIn 0.4s ease';
            loadQuestion();
        }

        // Initialize
        loadQuestion();
    </script>
</body>
</html>
